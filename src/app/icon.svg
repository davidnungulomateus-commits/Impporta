<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&amp;display=swap');
      .fav-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 204px;
        letter-spacing: -6px;
        fill: #111625;
      }
    </style>
  </defs>

  <!-- Background Squircle Container (Inverted to White) -->
  <rect width="512" height="512" rx="128" fill="#ffffff" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#111625" stroke-width="14" stroke-opacity="0.12" />

  <!-- The word ImP with Inter Black 900 (Inverted to Black) -->
  <text x="50%" y="53%" text-anchor="middle" dominant-baseline="central" class="fav-text">ImP</text>
</svg>
